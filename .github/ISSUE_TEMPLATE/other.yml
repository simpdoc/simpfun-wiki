name: 其他内容
description: 不属于文档内容建议或文档错误的其他问题与想法
title: "[其他] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        这里是开放讨论区，站点功能、样式、协作方式、流程建议等都可以提。

        如果只是想问个问题、聊聊想法，也可以直接去 [讨论区](https://github.com/simpdoc/simpfun-wiki/discussions)，那里更随意。

  - type: dropdown
    id: topic
    attributes:
      label: 主题
      description: 请选择最接近的一项。
      options:
        - 站点功能或交互
        - 界面样式与主题
        - 构建或部署
        - 协作方式与流程
        - 提问 / 求助
        - 其他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 详细描述
      description: 请说明你的问题、想法或建议。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关链接、截图（请打码敏感信息）、复现步骤等。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复内容
          required: true
        - label: 我上传的截图已清理掉 Token、IP、账号等敏感信息
          required: false
